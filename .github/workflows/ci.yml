name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mezzo/shared-types build
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run typecheck

  docs-and-tests-touched:
    name: Docs & tests touched
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SKIP_TEST_TOUCH_CHECK: ${{ contains(github.event.pull_request.labels.*.name, 'skip-test-check') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/check-touched-tests.mjs --base origin/${{ github.base_ref }}

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mezzo/shared-types build
      - run: pnpm --filter @mezzo/api exec jest --config jest.config.js --maxWorkers=2
      - run: pnpm --filter @mezzo/web run test

  api-e2e:
    name: API e2e (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mezzo/shared-types build
      - run: pnpm --filter @mezzo/api test:e2e

  web-e2e:
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mezzo/shared-types build
      - run: pnpm --filter @mezzo/web exec playwright install --with-deps chromium
      - run: pnpm --filter @mezzo/web test:e2e
